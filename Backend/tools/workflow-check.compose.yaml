name: katana-workflow-check
services:
  mongo:
    image: mongo:4.4
    networks: [checks]
  zookeeper:
    image: confluentinc/cp-zookeeper:5.4.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [checks]
  kafka:
    image: confluentinc/cp-enterprise-kafka:5.4.2
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [checks]
    depends_on: [zookeeper]
networks:
  checks:
    internal: true
