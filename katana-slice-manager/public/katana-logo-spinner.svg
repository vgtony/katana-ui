<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 976" role="img" aria-label="Loading">
  <style>
    .stripe {
      opacity: 0;
      animation: stripe-reveal 1.45s steps(1, end) infinite;
    }

    .stripe--middle {
      animation-delay: .18s;
    }

    .stripe--right {
      animation-delay: .36s;
    }

    @keyframes stripe-reveal {
      0%,
      12% {
        opacity: 0;
      }

      13%,
      82% {
        opacity: 1;
      }

      83%,
      100% {
        opacity: 0;
      }
    }
  </style>

  <image class="stripe" href="/spinner-pieces/logo-stripe-right.svg" x="0" width="288" height="976" />
  <image class="stripe stripe--middle" href="/spinner-pieces/logo-stripe-middle.svg" x="288" width="288" height="976" />
  <image class="stripe stripe--right" href="/spinner-pieces/logo-stripe-left.svg" x="576" width="288" height="976" />
</svg>
