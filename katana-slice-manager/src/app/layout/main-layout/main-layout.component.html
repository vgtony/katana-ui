<div class="layout-shell">
  @if (httpActivityService.isLoading()) {
    <div class="layout-loading-bar" aria-hidden="true">
      <span></span>
    </div>

    <div class="layout-loading-indicator" role="status" aria-live="polite">
      <span class="layout-loading-indicator__spinner" aria-hidden="true"></span>
      <span>Loading…</span>
    </div>
  }

  <app-sidebar></app-sidebar>

  <main class="layout-content">
    <div class="layout-toolbar">
      <button
        class="layout-theme-toggle"
        type="button"
        [attr.aria-label]="getThemeActionLabel()"
        (click)="toggleTheme()"
      >
        <span class="layout-theme-toggle__icon" aria-hidden="true">{{ getThemeIcon() }}</span>
        <span>{{ getThemeLabel() }}</span>
      </button>
    </div>

    <router-outlet></router-outlet>
  </main>
</div>
