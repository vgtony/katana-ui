<section class="registration-form">
  <div class="registration-form__header">
    <!-- <h3>Add a network function</h3>
    <p>Models `katana function add -f function.json` with NSD placement fields.</p> -->
  </div>

  <form class="registration-form__grid" [formGroup]="form">
    <label
      ><span>Function ID</span
      ><input type="text" formControlName="id" placeholder="group0_demo5GCore"
    /></label>
    <label
      ><span>Name</span><input type="text" formControlName="name" placeholder="group0_demo5GCore"
    /></label>
    <label><span>Generation</span><input type="number" formControlName="gen" /></label>
    <label><span>Func</span><input type="number" formControlName="func" /></label>
    <label><span>Type</span><input type="number" formControlName="type" /></label>
    <label
      ><span>Location</span><input type="text" formControlName="location" placeholder="group0_edge"
    /></label>
    <label><span>NSD ID</span><input type="text" formControlName="nsdId" /></label>
    <label><span>NS name</span><input type="text" formControlName="nsName" /></label>
    <label><span>Placement</span><input type="number" formControlName="placement" /></label>
    <label class="registration-form__checkbox"
      ><input type="checkbox" formControlName="sharedAvailability" /><span
        >Shared availability *</span
      ></label
    >
    <label class="registration-form__checkbox"
      ><input type="checkbox" formControlName="optional" /><span>Optional NS entry *</span></label
    >
    <button type="submit">Create function payload</button>
  </form>
</section>
