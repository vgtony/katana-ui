<section class="registration-form">
  <div class="registration-form__header">
    <!-- <h3>Upload cluster credentials</h3>
    <p>Models `katana k8s uploadcreds -f creds.yaml` for kubeconfig ingestion.</p> -->
  </div>

  <form class="registration-form__grid" [formGroup]="form" (ngSubmit)="submit()">
    <label class="registration-form__full"
      ><span>Credentials file</span
      ><input type="file" accept=".yaml,.yml,.json" (change)="onFileSelected($event)"
    /></label>
    @if (selectedFileName) {
      <p class="registration-form__status" role="status">Selected file: {{ selectedFileName }}</p>
    }
    <button type="submit" [disabled]="form.invalid || submitting">
      {{ submitting ? 'Uploading credentials...' : 'Upload Credentials' }}
    </button>
    @if (submitMessage) {
      <p class="registration-form__status registration-form__status--success" role="status">
        {{ submitMessage }}
      </p>
    }
    @if (submitError) {
      <p class="registration-form__status registration-form__status--error" role="alert">
        {{ submitError }}
      </p>
    }
  </form>
</section>
