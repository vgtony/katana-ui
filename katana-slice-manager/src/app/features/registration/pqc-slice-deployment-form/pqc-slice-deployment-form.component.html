<section class="registration-form">
  <div class="registration-form__header">
    <p class="registration-form__eyebrow">PQC Slice</p>
    <!-- <h3>Create a slice with PQC options</h3>
    <p>Models standard, PQC-enabled, and combined Proxmox plus Besu slice deployment inputs.</p> -->
  </div>

  <form class="registration-form__grid" [formGroup]="form">
    <label><span>Slice file</span><input type="text" formControlName="sliceFile" /></label>
    <label><span>Proxmox VM file</span><input type="text" formControlName="proxmoxFile" /></label>
    <label
      ><span>Ansible controller IP</span><input type="text" formControlName="ansibleControllerIp"
    /></label>
    <label class="registration-form__checkbox"
      ><input type="checkbox" formControlName="enablePqc" /><span
        >Enable PQC / Besu deployment *</span
      ></label
    >
    <label class="registration-form__checkbox"
      ><input type="checkbox" formControlName="enableProxmox" /><span
        >Enable Proxmox VM creation *</span
      ></label
    >
    <button type="submit">Create PQC slice payload</button>
  </form>
</section>
