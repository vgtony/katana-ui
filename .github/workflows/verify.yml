name: Verify Katana

on:
  pull_request:
  push:
    branches: [Code-cleanup]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend/katana-slice-manager
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: Frontend/katana-slice-manager/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/katana-slice-manager/package-lock.json
      - run: npm install --global npm@10.9.3
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm run build -- --configuration development
      - run: npm run build -- --configuration local-network

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:4.4
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongo --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements-test.txt
      - run: python -m pip install -r Backend/requirements-test.txt
      - run: python -m unittest discover -s Backend/tests -q
        env:
          PYTHONPATH: Backend:Backend/katana-nbi
          KATANA_TEST_MONGO_URI: mongodb://127.0.0.1:27017

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.21.3
      - run: python -m pip install PyYAML==6.0.3
      - run: python Backend/tools/check_free5gc_nest_chart.py
      - run: helm lint Helm/free5gc-1.3.1
