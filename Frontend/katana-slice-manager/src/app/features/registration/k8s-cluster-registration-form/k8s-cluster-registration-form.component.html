<section class="registration-form">
  <div class="registration-form__header">
    <!-- <h3>Register a Kubernetes cluster</h3>
    <p>Models `katana k8s add -f k8s.json` including deployment method flags.</p> -->
  </div>

  <form class="registration-form__grid" [formGroup]="form" (ngSubmit)="submit()">
    @if (restoreMessage) {
      <p class="registration-form__status" role="status">{{ restoreMessage }}</p>
    }
    <label
      ><span>Schema version</span
      ><input type="text" formControlName="schemaVersion" readonly aria-readonly="true"
    /></label>
    <label
      ><span>Credentials file</span
      ><input type="text" formControlName="credentials" readonly aria-readonly="true"
    /></label>
    <label
      ><span>Schema type</span
      ><input type="text" formControlName="schemaType" readonly aria-readonly="true"
    /></label>
    <label
      ><span>Name</span><input type="text" formControlName="name" placeholder="Microk8sCluster3"
    /></label>
    <label class="registration-form__full"
      ><span>Description</span
      ><input
        type="text"
        formControlName="description"
        placeholder="Isolated K8s cluster in mylocation"
    /></label>
    <label
      ><span>NFVO</span
      ><select formControlName="nfvoId" (change)="nfvoChanged()">
        <option value="">Select registered NFVO</option>
        @for (nfvo of nfvos; track nfvo._id) {
          <option [value]="nfvo.nfvo_id">{{ nfvo.nfvo_id }}</option>
        }
      </select></label
    >
    <label
      ><span>OSM VIM account</span
      ><select formControlName="vimAccount">
        <option value="">Select an enabled OSM VIM</option>
        @for (vim of vims; track vim.id) {
          <option [value]="vim.id">{{ vim.name }} · {{ vim.id }}</option>
        }
      </select></label
    >
    <label><span>K8s version</span><input type="text" formControlName="k8sVersion" /></label>
    <label
      ><span>K8s network (optional)</span
      ><input type="text" formControlName="k8sNet1" placeholder="network name"
    /></label>
    <label><span>Namespace</span><input type="text" formControlName="namespace" /></label>
    <label class="registration-form__checkbox"
      ><input type="checkbox" formControlName="jujuBundle" /><span
        >Enable juju-bundle *</span
      ></label
    >
    <label class="registration-form__checkbox"
      ><input type="checkbox" formControlName="helmChartV3" /><span
        >Enable helm-chart-v3 *</span
      ></label
    >
    <button type="submit" [disabled]="form.invalid || submitting || loadingInventory">
      {{ submitting ? 'Registering K8s cluster...' : 'Register K8s Cluster' }}
    </button>
    @if (loadingInventory) {
      <p class="registration-form__status" role="status">Loading NFVOs and enabled OSM VIMs…</p>
    }
    @if (inventoryError) {
      <p class="registration-form__status registration-form__status--error" role="alert">
        {{ inventoryError }}
      </p>
    }
    @if (submitting) {
      <div class="registration-form__loader" role="status" aria-live="polite">
        <span class="registration-form__spinner" aria-hidden="true"></span>
        <span>Registering K8s cluster…</span>
      </div>
    }
    @if (submitMessage) {
      <p class="registration-form__status registration-form__status--success" role="status">
        {{ submitMessage }}
      </p>
    }
    @if (submitError) {
      <p class="registration-form__status registration-form__status--error" role="alert">
        {{ submitError }}
      </p>
    }
  </form>
</section>
